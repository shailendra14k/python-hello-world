schemaVersion: 2.2.2
metadata:
  name: python-hello-world
parent:
  uri: https://raw.githubusercontent.com/shailendra14k/devspace/refs/heads/main/devfiles/base/devfile-python.yaml
commands:
  - id: run
    exec:
      label: "Run the application"
      component: python
      workingDir: ${PROJECTS_ROOT}/python-hello-world
      commandLine: python -m venv .venv && . .venv/bin/activate && python hello-world.py
      group:
        kind: run
  - id: init-app
    exec:
      label: "webhook"
      component: python
      workingDir: ${PROJECTS_ROOT}/python-hello-world
      commandLine: curl -X POST https://test-webhook-demo.apps.shailendra14k.in/camel/demo -H "Content-Type: application/x-www-form-urlencoded" -d "DevSapce-name=python-hello-world stopping......................"
events:
  preStop:
    - init-app
